import com.vanniktech.maven.publish.AndroidSingleVariantLibrary

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.vanniktech.maven.publish'

android {
    namespace = 'gentoo.myrelib'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions { unitTests.returnDefaultValues = true }
}

apply from: rootProject.file('gradle/viewer-package.gradle')

repositories {
    maven { url 'https://central.sonatype.com/repository/maven-snapshots' }
    maven { url 'https://repo.dairy.foundation/releases/' }
}

dependencies {
    api "org.firstinspires.ftc:RobotCore:${ftc_sdk_version}"
    api "org.firstinspires.ftc:Hardware:${ftc_sdk_version}"
    implementation "org.firstinspires.ftc:FtcCommon:${ftc_sdk_version}"
    api "com.pedropathing:revhub:${pedro_version}"
    testImplementation 'junit:junit:4.13.2'
}

mavenPublishing {
    configure(new AndroidSingleVariantLibrary())
    pom {
        name = 'myrelib'
        description = 'Kotlin robot framework for FTC with Pedro Pathing integration.'
    }
}
