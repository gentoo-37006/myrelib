apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'com.vanniktech.maven.publish'

evaluationDependsOn(':myrelib')

sourceSets {
    symbolNames
}

configurations {
    ftcProcessorApi { transitive = false }
}

def extractFtcProcessorApi = tasks.register('extractFtcProcessorApi', Sync) {
    from { configurations.ftcProcessorApi.collect { zipTree(it) } }
    include 'classes.jar'
    into layout.buildDirectory.dir('intermediates/ftc-processor-api')
}

def ftcProcessorClasses = files(
    layout.buildDirectory.file('intermediates/ftc-processor-api/classes.jar')
) {
    builtBy extractFtcProcessorApi
}

// Target Java 17 without requiring an exactly matching installed toolchain.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    implementation "com.google.devtools.ksp:symbol-processing-api:${kspVersion}"
    symbolNamesImplementation files(project(':myrelib').tasks.named('bundleLibCompileToJarRelease'))
    symbolNamesImplementation ftcProcessorClasses
    ftcProcessorApi "org.firstinspires.ftc:RobotCore:${ftcSdkVersion}"
    testImplementation 'junit:junit:4.13.2'
}

// Resolve referenced types at build time. KSP's JVM classpath cannot load Android AARs.
def generatedSymbolsDirectory = layout.buildDirectory.dir('generated/auton-symbols')
def generateAutonSymbols = tasks.register('generateAutonSymbols', JavaExec) {
    classpath = sourceSets.symbolNames.runtimeClasspath
    mainClass = 'gentoo.myrelib.processor.GenerateAutonSymbolsKt'
    outputs.dir(generatedSymbolsDirectory)
    args(generatedSymbolsDirectory.get().file('AutonSymbols.kt').asFile)
}
kotlin.sourceSets.main.kotlin.srcDir(generateAutonSymbols)

mavenPublishing {
    coordinates(project.group.toString(), 'myrelib-processor', project.version.toString())
    pom {
        name = 'myrelib KSP processor'
        description = 'Generates alliance-specific FTC autonomous opmode wrappers from myrelib declarations.'
    }
}
