import org.gradle.api.file.ArchiveOperations
import org.gradle.api.file.FileSystemOperations

import javax.inject.Inject
import java.nio.file.Files
import java.nio.file.StandardCopyOption

abstract class CacheViewerPackage extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getResolvedArchives()

    @OutputFile
    abstract RegularFileProperty getCachedArchive()

    @TaskAction
    void updateCache() {
        def archives = resolvedArchives.files
        def cache = cachedArchive.get().asFile
        if (archives.isEmpty()) {
            if (!cache.isFile()) {
                throw new GradleException(
                    'Could not resolve io.github.gentoo-37006:visualizer from Maven Central and no cached download is available. ' +
                    'Check that a visualizer release is available on Maven Central.'
                )
            }
            logger.warn('Could not refresh the viewer from Maven Central. Using the last downloaded viewer.')
            return
        }
        if (archives.size() != 1) throw new GradleException('Expected exactly one viewer package ZIP')

        def parent = Files.createDirectories(cache.parentFile.toPath())
        def temporary = Files.createTempFile(parent, 'viewer-', '.zip')
        try {
            Files.copy(archives.first().toPath(), temporary, StandardCopyOption.REPLACE_EXISTING)
            Files.move(temporary, cache.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
        } finally {
            Files.deleteIfExists(temporary)
        }
    }
}

abstract class UnpackViewerPackage extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getArchive()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract ArchiveOperations getArchives()

    @Inject
    abstract FileSystemOperations getFiles()

    @TaskAction
    void unpack() {
        files.sync {
            into(outputDirectory)
            into('field-viewer') {
                from(archives.zipTree(archive.get().asFile))
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            mavenCentral { name = 'visualizerCentral' }
        }
        filter { includeModule('io.github.gentoo-37006', 'visualizer') }
    }
}

def viewerArchive = configurations.create('viewerPackage') {
    canBeConsumed = false
    canBeResolved = true
    resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')
}
dependencies.add(viewerArchive.name, 'io.github.gentoo-37006:visualizer:0.+@zip')

def cachedViewer = tasks.register('cacheViewerPackage', CacheViewerPackage) {
    resolvedArchives.from(viewerArchive.incoming.artifactView { lenient = true }.files)
    cachedArchive.set(rootProject.layout.projectDirectory.file('.gradle/viewer-package/field-viewer.zip'))
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def unpack = tasks.register("unpack${variant.name.capitalize()}ViewerPackage", UnpackViewerPackage) {
        archive.set(cachedViewer.flatMap { it.cachedArchive })
    }
    variant.sources.assets.addGeneratedSourceDirectory(unpack) { it.outputDirectory }
}
