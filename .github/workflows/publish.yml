name: Publish myrelib to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select the next myrelib version
        run: |
          version=$(python3 .github/scripts/next-release-version.py)
          printf 'MYRELIB_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'Publishing myrelib %s\n' "$version"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi

      - name: Test and stage the signed Maven artifacts
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          ./gradlew -PverifyPublication -PsignPublication :myrelib:testDebugUnitTest \
            :myrelib:publishAllPublicationsToVerificationRepository \
            :processor:publishAllPublicationsToVerificationRepository \
            :yb:validatePlugins :yb:publishAllPublicationsToVerificationRepository

      - name: Build the sandbox against the staged artifacts
        run: ./gradlew -PverifyPublication :testbot:testDebugUnitTest :testbot:assembleRelease

      - name: Publish the artifacts to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 .github/scripts/publish-central.py build/publication-test-repo myrelib
